name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow via OIDC (trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No caching in release builds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      # Trusted publishing needs npm 11.5.1+; don't rely on the version bundled with Node.
      - run: npm install -g npm@latest && npm --version
      # npm, not pnpm, so it handles the OIDC exchange and provenance itself.
      # Staged: nothing goes live until a maintainer approves it with 2FA on npmjs.com.
      # Verbose so a failed OIDC exchange shows up in the log instead of a bare E401.
      - run: npm stage publish --loglevel verbose
